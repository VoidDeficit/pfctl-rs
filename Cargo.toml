[package]
name = "pfctl"
version = "0.7.0"
authors = ["Mullvad VPN"]
license = "MIT/Apache-2.0"
description = "Library for interfacing with the Packet Filter (PF) firewall on macOS"
repository = "https://github.com/mullvad/pfctl-rs"
readme = "README.md"
keywords = ["pf", "firewall", "macos", "packet", "filter"]
categories = ["network-programming", "os", "os::macos-apis", "api-bindings"]
edition = "2024"
rust-version = "1.85.0"

[badges]
travis-ci = { repository = "mullvad/pfctl-rs" }


[dependencies]
ioctl-sys = "0.8.0"
libc = "0.2.29"
derive_builder = "0.20"
ipnetwork = "0.21.1"

# Used only on FreeBSD, to build/pack the nvlist payloads DIOCADDRULENV expects (see
# src/nv.rs). Its `libnv-sys` build script only links `-lnv` under `target_os = "freebsd"`
# (no-op elsewhere), but the dependency itself is still kept OS-gated here so it never even
# attempts to build on macOS.
[target.'cfg(target_os = "freebsd")'.dependencies]
libnv = "0.5.2"

[dev-dependencies]
assert_matches = "1.1.0"
uuid = { version = "1.8.0", features = ["v4"] }
scopeguard = "1.0"
tun = "0.7.4"

# Transitive dependencies with incorrect semver use
# or that no longer compile for some reason.
# All of these belong to 'tun'
ipnet = "2.6.0"
log = "0.4.22"

# `ioctl-sys` 0.8.0 upstream (https://github.com/jmesmon/ioctl) hardcodes an allowlist of
# target_os values for its ioctl-encoding constants (linux/macos/openbsd/android) and hits a
# deliberate compile error (`use platform_not_supported`) on anything else, including FreeBSD --
# even though FreeBSD's ioctl encoding (see /usr/include/sys/ioccom.h) is bit-for-bit identical
# to OpenBSD's. This points at a local fork (`../ioctl-sys-freebsd`) that adds a `freebsd.rs`
# platform module, a straight copy of upstream's `openbsd.rs`. This is a local development
# stopgap; a real fix should go upstream to jmesmon/ioctl, or the crate should be forked properly
# on GitHub the same way pfctl-rs itself is being forked here.
[patch.crates-io]
ioctl-sys = { path = "../ioctl-sys-freebsd" }
